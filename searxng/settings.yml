general:
  debug: false
  instance_name: "searxng"
  
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "change_me_in_production"
  limiter: false
  image_proxy: false
  method: "GET"

engines:
  - name: google
    engine: google
    shortcut: go
    categories: general
    enabled: true
    
  - name: bing
    engine: bing
    shortcut: bi
    categories: general
    enabled: true

doi_resolvers:
  default: "https://doi.org"


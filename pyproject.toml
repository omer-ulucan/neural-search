[project]
name = "neural-search"
version = "0.2.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Please use `import python_multipart`:PendingDeprecationWarning",
]

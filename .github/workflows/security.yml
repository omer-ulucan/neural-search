name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    # Warn-only for now: the pinned versions currently have known advisories.
    # Remove `continue-on-error` once the dependency bumps have landed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit exactly-pinned requirements
        # requirements.txt also has ranges (numpy<2, llama-cpp-python>=...), and
        # resolving those would install torch. Audit the exact pins without
        # installing anything.
        run: |
          grep -E '==' requirements.txt > pinned.txt
          pip-audit -r pinned.txt --no-deps --disable-pip

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
